[build-system]
requires = ["poetry-core>=2.2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "greenlit"
requires-python = ">=3.10"
license = "Apache-2.0 AND GPL-2.0-only"
license-files = ["LICENSE", "LICENSES/GPL-2.0-only.txt"]
dynamic = [
    "version", "description", "readme",
    "authors", "dependencies", "scripts",
]

[tool.poetry]
name = "greenlit"
version = "3.1.1"
description = "Automates Base OS testing with scripts and patches"
readme = "docs/user-guides/user-manual.md"
authors = ["NVIDIA GreenLiT"]
packages = [
    {include = "greenlit", from = "src"},
    {include = "common", from = "src"},
    {include = "modules", from = "src"},
    {include = "scripts", from = "src"},
    {include = "*", from = "src/bin", to = "greenlit/_runtime/bin"}
]

# Include package data and configuration files
include = [
    "confs/hardware-manifest.json",
    "confs/glt-confs.d/**/*",
    "confs/greenlit.service",
    "confs/greenlit.timer",
    "external_tests/**/*",
    "src/common/virt/kvm_microvm/*",
    "src/modules/acpi/tegra_smccc_chipid_probe/*",
    "src/modules/arm64/brbe_nvhe/*",
    "src/modules/arm64/ffa_dma_runtime/*",
    "src/modules/arm64/ffa_stmm_runtime/*",
    "src/modules/arm64/ls64/*",
    "src/modules/cpu/cppc_cpc_read_probe/*",
    "src/modules/i2c/kretprobes/*",
    "src/modules/iommu/cmdqv_hyp_own/*",
    "src/modules/iommu/sva_invalidate/*",
    "src/modules/mm/bingo/*",
    "src/modules/mm/contpte_access_flags/*",
    "src/modules/mm/hotplug_tlb/*",
    "src/modules/pci/aspm_l1ss_saved_state_probe/*",
    "src/modules/pci/aspm_saved_state_probe/*",
    "src/modules/pci/bridge_window_probe/*",
    "src/modules/iommu/nested_ste/*.bt"
]

[tool.poetry.dependencies]
python = ">=3.10"
pyyaml = "^6.0.1"
packaging = "^25.0"

[tool.poetry.scripts]
glt-test-suite = "greenlit.greenlit:main"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pylint = "^2.15"
