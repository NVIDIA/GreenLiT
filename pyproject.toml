[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "greenlit"
version = "2.3.4"
description = "Automates Base OS testing with scripts and patches"
readme = "docs/user-guides/user-manual.md"
authors = ["NVIDIA GreenLiT"]
license = "Apache-2.0"
packages = [
    {include = "greenlit", from = "src"},
    {include = "common", from = "src"},
    {include = "modules", from = "src"},
    {include = "scripts", from = "src"}
]

# Include package data and configuration files
include = [
    "confs/hardware-manifest.json",
    "confs/glt-confs.d/**/*",
    "confs/greenlit.service",
    "confs/greenlit.timer",
    "data/**/*",
    "external_tests/**/*",
    "src/modules/i2c/kretprobes/*",
    "src/modules/mm/bingo/*"
]

[tool.poetry.dependencies]
python = ">=3.9"
pyyaml = "^6.0.1"
packaging = "^25.0"

[tool.poetry.scripts]
glt-test-suite = "greenlit.greenlit:main"
check-kernel-patches = "scripts.check_kernel_patches:main"
check-kernel-config = "scripts.check_kernel_config:main"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pylint = "^2.15"
